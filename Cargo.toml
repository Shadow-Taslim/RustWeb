[package]
name = "nimbus-weather"
version = "1.0.0"
edition = "2024"
description = "A fast, accessible weather web app built with Rust and Axum"
license = "MIT"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
